<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h2>Cadastro</h2>
    <form id="formulario">
        <label>Nome: </label>
        <input type="text" id="nome"><br>

        <label>Cpf: </label>
        <input type="text" id="cpf"><br>

        <label>Ano de nascimento: </label>
        <input type="number" id="anoNasc"><br>

        <label>Senha:</label>
        <input type="password" id="senha"><br>

        <label>Confirmar senha: </label>
        <input type="password" id="confSenha"><br>

        <p id="erroNome" class="erro"></p><br>
        <p id="erroCpf" class="erro"></p><br>
        <p id="erroAno" class="erro"></p><br>
        <p id="erroSenha" class="erro"></p><br>
        <p id="erroConfSenha" class="erro"></p><br>

        <button type="submit">Enviar</button>
    </form>

    <div id="erros"></div>

    <script src="Codes/codesao.js"></script>
</body>

</html>
